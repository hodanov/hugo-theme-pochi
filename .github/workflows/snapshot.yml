name: Snapshot
permissions:
  contents: read

# No path filters: these jobs are required status checks, and a filtered-out
# run would leave the check pending forever.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  vrt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node/Hugo versions come from mise.toml (single source of truth).
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Check build determinism
        run: |
          bash scripts/build-site.sh "$RUNNER_TEMP/build-a" --minify --baseURL http://127.0.0.1:4173/
          bash scripts/build-site.sh "$RUNNER_TEMP/build-b" --minify --baseURL http://127.0.0.1:4173/
          diff -rq "$RUNNER_TEMP/build-a" "$RUNNER_TEMP/build-b"

      - name: Run visual regression tests
        run: npm run vrt

      - name: Upload VRT artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-results
          path: |
            test-results/snapshot
            playwright-report/snapshot
          if-no-files-found: ignore
          retention-days: 7

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Run accessibility checks
        run: npm run a11y

      - name: Upload a11y artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-results
          path: |
            test-results/snapshot
            playwright-report/snapshot
          if-no-files-found: ignore
          retention-days: 7
