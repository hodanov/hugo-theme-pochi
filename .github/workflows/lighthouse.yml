name: Lighthouse
permissions:
  contents: read

# Report only: every assertion in scripts/lighthouse-targets.json is a warning
# and this job is not a required status check. Results go to the job summary
# and the lighthouse-reports artifact.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node/Hugo versions come from mise.toml (single source of truth).
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install dependencies
        run: npm ci

      # Same Chromium build as the E2E tests, pinned by @playwright/test.
      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouse
          # upload-artifact skips dot directories unless told otherwise.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
