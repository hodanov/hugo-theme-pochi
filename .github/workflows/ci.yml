name: CI
permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node/Hugo versions come from mise.toml (single source of truth).
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Build example site
        run: |
          THEME_NAME=$(basename "$GITHUB_WORKSPACE")
          THEMES_DIR=$(dirname "$GITHUB_WORKSPACE")
          hugo --gc -s example_site --themesDir "$THEMES_DIR" -t "$THEME_NAME"

      - name: Install dependencies
        run: npm ci

      # Ratchet: html-validate findings per rule must match tests/baselines.
      - name: Validate HTML
        run: npm run lint:html

  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: npm ci

      - name: Verify vendor integrity
        run: npm run vendor:verify
