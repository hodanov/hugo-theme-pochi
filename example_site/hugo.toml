baseURL = "/"
title = "Pochi Example"
# Default language is English at root (/)
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
description = "Pochi example site for theme E2E tests."
keywords = ["pochi", "hugo", "theme", "example"]

[params.likeApi]
baseUrl = "http://localhost:9999"

[params.viewTransitions]
enable = true

[params.scrollFadeIn]
enable = true

[params.comment]
enable = true
provider = "disqus"

[outputs]
home = ["HTML", "JSON", "RSS"]

[menus]
[[menus.main]]
name = "About"
url = "/page/about/"
weight = 1

[languages]
[languages.en]
label = "English"
locale = "en"
weight = 1

[languages.ja]
label = "日本語"
locale = "ja"
weight = 2

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
lineNos = true
lineNumbersInTable = false

[pagination]
pagerSize = 3
