baseURL = "/"
title = "Pochi Example"
# Default language is English at root (/)
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
# Count Japanese by characters, for the reading time
hasCJKLanguage = true

[params]
description = "Pochi example site for theme E2E tests."
# Explicit, because Hugo's automatic pick (the section with the most pages) is
# a tie on the ja site (posts vs. the styleguide page) and flips between builds.
mainSections = ["posts"]
keywords = ["pochi", "hugo", "theme", "example"]
# Without it browsers request /favicon.ico, and the 404 shows up as a console
# error in Lighthouse.
favicon = "/favicon.svg"

[params.likeApi]
baseUrl = "http://localhost:9999"

[params.viewTransitions]
enable = true

[params.scrollFadeIn]
enable = true

[params.comment]
enable = true
provider = "disqus"

[outputs]
home = ["HTML", "JSON", "RSS"]

[menus]
[[menus.main]]
name = "About"
url = "/page/about/"
weight = 1

# A parent with children, so the dropdown is covered by VRT, a11y and E2E
[[menus.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 2

[[menus.main]]
parent = "posts"
name = "Archives"
url = "/archives/"
weight = 1

[[menus.main]]
parent = "posts"
name = "Tags"
url = "/tags/"
weight = 2

[languages]
[languages.en]
label = "English"
locale = "en"
weight = 1

[languages.ja]
label = "日本語"
locale = "ja"
weight = 2

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
lineNos = true
lineNumbersInTable = false

[pagination]
pagerSize = 3
