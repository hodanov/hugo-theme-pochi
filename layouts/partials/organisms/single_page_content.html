<main id="main-content" class="main-content">
  {{ partial "molecules/hero" . }}
  <div class="l-container single-page">
    <div class="l-shell l-shell--single">
      <div id="contents">
        {{ partial "molecules/breadcrumbs.html" . }}
        <article>
          {{ if not .Params.featuredImage }}
            <h1>{{ .Title }}</h1>
          {{ end }}
          {{ partial "molecules/post_meta_date.html" . }}
          <div>
            {{ partial "atoms/content.html" . }}
          </div>
        </article>
      </div>
    </div>
  </div>
</main>
