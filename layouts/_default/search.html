{{ define "main" }}
  <main id="main-content" class="main-content">
    {{ partial "molecules/breadcrumbs.html" . }}
    <div class="l-container">
      <div class="l-shell l-shell--search">
        <div id="contents">
          <h1>{{ .Title }}</h1>
          <div class="article-list">
            {{/* The count is read out when results arrive */}}
            <p
              id="search-status"
              class="u-visually-hidden"
              role="status"
              data-i18n-results="{{ T "search_results" }}"
            ></p>
            <div
              id="search-results"
              data-i18n-no-results="{{ T "no_matches" }}"
            ></div>
            <div class="search-loading">{{ T "loading" }}</div>
            {{/* Same card as organisms/list_of_posts.html */}}
            <script id="search-result-template" type="text/x-js-template">
              <div class="post-row" id="summary-${key}">
                <div class="post-card">
                  <div class="post-title">
                    <h2><a class="post-card-link" href="${link}">${title}</a></h2>
                  </div>
                  <div class="post-meta">
                    <div class="post-info">
                      <div class="kiji-date">
                        <time datetime="${publishDate}">
                          <span class="u-visually-hidden">{{ T "published" }}</span>
                          {{- partial "atoms/icon.html" (dict "id" "icon-pencil") }}
                          <span aria-hidden="true">:</span>
                          ${publishDate}
                        </time>
                        <span aria-hidden="true">|</span>
                        <time datetime="${lastmod}">
                          <span class="u-visually-hidden">{{ T "updated" }}</span>
                          {{- partial "atoms/icon.html" (dict "id" "icon-spinner") }}
                          <span aria-hidden="true">:</span>
                          ${lastmod}
                        </time>
                      </div>
                    </div>
                  </div>
                  <div class="post-excerpt">
                    ${snippet}
                  </div>
                </div>
              </div>
            </script>
            {{ partial "core/resources_search_js.html" . }}
            <div class="pagination-index"></div>
          </div>
        </div>
        {{ block "sidebar" . }}
        {{ end }}
      </div>
    </div>
  </main>
{{ end }}
